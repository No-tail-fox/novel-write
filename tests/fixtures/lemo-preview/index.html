<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>L-6 preview consistency fixture</title>
<!-- Lemo page contract (vendor/lemo-upstream/core/README.md): window.READY, window.DUR (seconds), deterministic window.render(t), t in seconds, any order.
     Canvas 2D only, no assets, no randomness, no clocks: the same t must give the same picture in still.mjs (headless shell) and in the app preview (Electron). -->
<style>html,body{margin:0;width:480px;height:270px;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="480" height="270"></canvas>
<script>
(function () {
  var W = 480, H = 270, DUR = 2;
  var ctx = document.getElementById('c').getContext('2d');
  function render(t) {
    var k = Math.max(0, Math.min(1, t / DUR));
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, 'rgb(' + Math.round(30 + 180 * k) + ',40,' + Math.round(200 - 150 * k) + ')');
    g.addColorStop(1, 'rgb(10,' + Math.round(60 + 120 * k) + ',90)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd400';
    ctx.fillRect(Math.round(20 + k * 340), 70, 120, 120);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(k * Math.PI);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-150, -12, 300, 24);
    ctx.restore();
    ctx.fillStyle = '#20e0a0';
    ctx.fillRect(0, H - 24, Math.round(W * k), 24);
    ctx.beginPath();
    ctx.arc(W - 60, 50 + k * 150, 36, 0, Math.PI * 2);
    ctx.fillStyle = '#ff3060';
    ctx.fill();
    // Generic font on purpose: glyph differences between Chromium builds must stay below the hash resolution.
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText('t=' + t.toFixed(2), 16, 40);
  }
  window.DUR = DUR;
  window.render = render;
  render(0);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { window.READY = true; });
})();
</script>
</body>
</html>
