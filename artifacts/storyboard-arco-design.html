<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryDream Arco-Style Prototype</title>
    <!-- 使用 Arco Design CDN 引入样式和 React 基础环境 (纯模拟) -->
    <link rel="stylesheet" href="https://unpkg.com/@arco-design/web-react@2.63.1/dist/css/arco.css">
    <style>
        :root {
            --arco-primary-6: #f2614b; /* 映射 StoryDream 品牌色 */
            --bg-color: #101214;
        }
        body { margin: 0; background-color: var(--bg-color); color: #fff; font-family: 'Segoe UI', sans-serif; }
        
        .layout { height: 100vh; display: flex; flex-direction: column; }
        
        /* 顶部导航 (Arco 风格) */
        .navbar { height: 50px; border-bottom: 1px solid #343a40; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; }
        
        /* 编辑区 */
        .editor-container { flex: 1; display: flex; overflow: hidden; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #15181b; }
        .canvas-card { width: 600px; height: 340px; border: 1px solid #343a40; background: #1b1f23; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        
        /* 侧边属性栏 */
        .sidebar { width: 300px; background: #15181b; border-left: 1px solid #343a40; padding: 20px; }
        
        /* 底部时间轴 */
        .timeline-bar { height: 180px; background: #1b1f23; border-top: 1px solid #343a40; padding: 20px; display: flex; gap: 15px; overflow-x: auto; }
        .shot-card { width: 150px; height: 100%; border-radius: 6px; background: #24292e; border: 1px solid #444; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.34, 0.69, 0.1, 1); cursor: pointer; }
        .shot-card:hover { border-color: #f2614b; transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="layout">
        <div class="navbar">
            <span style="font-weight: 700;">StoryDream AI 漫剧编辑器</span>
            <button style="background: #f2614b; color: white; border: none; padding: 6px 16px; border-radius: 4px;">生成漫剧</button>
        </div>
        <div class="editor-container">
            <div class="canvas-area">
                <div class="canvas-card">分镜预览画布</div>
            </div>
            <div class="sidebar">
                <h3>分镜设置</h3>
                <div style="margin-bottom: 10px;">提示词:</div>
                <textarea style="width: 100%; height: 80px; background: #101214; border: 1px solid #343a40; color: white;"></textarea>
            </div>
        </div>
        <div class="timeline-bar">
            <div class="shot-card">分镜 1</div>
            <div class="shot-card">分镜 2</div>
            <div class="shot-card">分镜 3</div>
            <div class="shot-card" style="border-style: dashed; opacity: 0.6;">+ 添加</div>
        </div>
    </div>
</body>
</html>
