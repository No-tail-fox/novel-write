<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryDream 漫剧分镜编辑器 · 动效原型</title>
<style>
  :root{
    --shell-bg:#101214; --shell-surface:#15181b; --shell-surface-raised:#1b1f23;
    --shell-border:#343a40; --shell-text:#f4f6f8; --shell-muted:#b1b8be;
    --shell-accent:#f2614b; --ok:#65b883; --warn:#e0a34c;
    --sd-radius:8px;
    /* 动效令牌：Arco 质感的关键 */
    --motion-fast:120ms;
    --motion-base:200ms;
    --motion-slow:320ms;
    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --elev-1:0 1px 2px rgba(0,0,0,.24);
    --elev-2:0 4px 12px rgba(0,0,0,.32);
    --elev-3:0 12px 32px rgba(0,0,0,.44);
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;overflow:hidden;background:var(--shell-bg);color:var(--shell-text);
       font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif;font-size:13px}
  .app{display:flex;flex-direction:column;height:100vh}

  /* 顶栏 */
  .topbar{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;
          background:var(--shell-surface);border-bottom:1px solid var(--shell-border);flex:none}
  .topbar h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.2px}
  .topbar .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border-radius:6px;
       border:1px solid transparent;font-size:13px;font-weight:500;cursor:pointer;background:none;
       color:var(--shell-text);transition:background var(--motion-fast) var(--ease-out),
                 transform var(--motion-fast) var(--ease-out),
                 box-shadow var(--motion-fast) var(--ease-out)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--shell-accent);color:#fff;box-shadow:0 2px 8px rgba(242,97,75,.32)}
  .btn.primary:hover{filter:brightness(1.08);box-shadow:0 4px 16px rgba(242,97,75,.44)}
  .btn.ghost{border-color:var(--shell-border);color:var(--shell-muted)}
  .btn.ghost:hover{background:#23272b;color:var(--shell-text)}

  /* 主体三栏 */
  .body{flex:1;display:flex;min-height:0}

  /* 左：分镜列表 */
  .rail{width:232px;flex:none;background:var(--shell-surface);border-right:1px solid var(--shell-border);
        overflow-y:auto;padding:8px}
  .rail-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;
              color:var(--shell-muted);padding:8px 8px 6px;font-weight:600}
  .rail-item{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:6px;cursor:pointer;
             border:1px solid transparent;margin-bottom:2px;
             transition:background var(--motion-fast) var(--ease-out),
             border-color var(--motion-fast) var(--ease-out)}
  .rail-item:hover{background:#1f2429}
  .rail-item.active{background:#352321;border-color:rgba(242,97,75,.5)}
  .rail-thumb{width:52px;height:36px;border-radius:4px;background:#24292e;flex:none;
              display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--shell-muted)}
  .rail-name{font-size:12px;line-height:1.3}
  .rail-meta{font-size:11px;color:var(--shell-muted)}

  /* 中：画布 */
  .stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--shell-bg)}
  .stage-toolbar{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;
                 border-bottom:1px solid var(--shell-border)}
  .seg{display:flex;background:var(--shell-surface);border:1px solid var(--shell-border);
       border-radius:6px;padding:2px;gap:2px}
  .seg button{border:none;background:none;color:var(--shell-muted);font-size:12px;padding:3px 10px;
              border-radius:4px;cursor:pointer;transition:all var(--motion-fast) var(--ease-out)}
  .seg button.on{background:#2b3137;color:var(--shell-text)}
  .stage-canvas{flex:1;min-height:0;overflow:auto;display:flex;padding:16px}
  .frame{flex:1;min-height:0;border-radius:var(--sd-radius);position:relative;
         background:repeating-linear-gradient(45deg,#1b1f23,#1b1f23 10px,#181c20 10px,#181c20 20px);
         border:1px solid var(--shell-border);box-shadow:var(--elev-2);
         display:flex;align-items:center;justify-content:center;color:var(--shell-muted);
         transition:box-shadow var(--motion-base) var(--ease-out)}
  .frame:hover{box-shadow:var(--elev-3)}
  .frame-label{font-size:12px;letter-spacing:.4px}
  .badge{position:absolute;top:10px;left:10px;font-size:11px;padding:2px 8px;border-radius:999px;
         background:rgba(101,184,131,.16);color:var(--ok);border:1px solid rgba(101,184,131,.4)}

  /* 右：属性栏 */
  .inspector{width:304px;flex:none;background:var(--shell-surface);border-left:1px solid var(--shell-border);
             overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11px;color:var(--shell-muted);font-weight:600;letter-spacing:.3px}
  .field input,.field textarea,.field select{width:100%;background:var(--shell-bg);color:var(--shell-text);
        border:1px solid var(--shell-border);border-radius:6px;padding:7px 9px;font-size:12px;
        font-family:inherit;outline:none;transition:border-color var(--motion-fast) var(--ease-out),
        box-shadow var(--motion-fast) var(--ease-out)}
  .field textarea{resize:vertical;min-height:76px;line-height:1.55}
  .field input:focus,.field textarea:focus,.field select:focus{
        border-color:var(--shell-accent);box-shadow:0 0 0 3px rgba(242,97,75,.18)}
  .field .hint{font-size:11px;color:var(--shell-muted)}

  /* 底：时间轴 */
  .timeline{height:176px;flex:none;background:var(--shell-surface);border-top:1px solid var(--shell-border);
            display:flex;flex-direction:column}
  .timeline-head{height:32px;display:flex;align-items:center;gap:8px;padding:0 16px;
                 border-bottom:1px solid var(--shell-border);font-size:11px;color:var(--shell-muted)}
  .timeline-track{flex:1;display:flex;gap:12px;padding:12px 16px;overflow-x:auto;align-items:stretch}
  .shot{width:152px;flex:none;border-radius:var(--sd-radius);background:var(--shell-surface-raised);
        border:1px solid var(--shell-border);cursor:pointer;position:relative;overflow:hidden;
        display:flex;flex-direction:column;
        transition:transform var(--motion-base) var(--ease-spring),
                   border-color var(--motion-base) var(--ease-out),
                   box-shadow var(--motion-base) var(--ease-out)}
  .shot:hover{transform:translateY(-4px);box-shadow:var(--elev-2);border-color:#4a5259}
  .shot.active{border-color:var(--shell-accent);box-shadow:0 0 0 1px var(--shell-accent),var(--elev-2)}
  .shot-thumb{flex:1;background:#1b1f23;display:flex;align-items:center;justify-content:center;
              color:var(--shell-muted);font-size:11px}
  .shot-foot{padding:5px 8px;font-size:11px;color:var(--shell-muted);
             border-top:1px solid var(--shell-border);display:flex;justify-content:space-between}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
  .shot-add{width:64px;flex:none;border:1px dashed var(--shell-border);border-radius:var(--sd-radius);
            display:flex;align-items:center;justify-content:center;color:var(--shell-muted);
            cursor:pointer;transition:all var(--motion-base) var(--ease-out)}
  .shot-add:hover{border-color:var(--shell-accent);color:var(--shell-accent);background:#1f2429}
  /* 紧凑预览：画面保留比例，信息围绕画面组织。 */
  .rail{width:184px}
  .inspector{width:280px;padding:12px;gap:12px}
  .stage-canvas{display:block;padding:12px}
  .frame{width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--shell-surface-raised)}
  .frame img{width:100%;height:100%;object-fit:contain;display:block}
  .badge{background:#172c21;color:#a2e0b8;border-color:#426650}
  .scene-summary{padding:12px 0;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--shell-border)}
  .scene-summary strong{font-size:14px}.scene-summary p{margin:5px 0 0;color:var(--shell-muted);line-height:1.6}
  .scene-summary small{white-space:nowrap;color:var(--shell-muted)}
  .context-row{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;color:var(--shell-muted);font-size:12px}
  .context-row span{padding:6px 9px;border:1px solid var(--shell-border);border-radius:6px}
  .timeline{height:150px}.timeline-head{flex:none}.timeline-track{min-height:0;padding:10px 16px}
  .shot{width:152px}.shot-thumb{min-height:0;overflow:hidden}.shot-thumb img{width:100%;height:100%;object-fit:cover}
  .rail-item,.shot,.shot-add{font-family:inherit;color:inherit;text-align:left}
  .rail-item{width:100%;background:none}.shot-add{background:none;width:96px}
  .rail-thumb{overflow:hidden}.rail-thumb img{width:100%;height:100%;object-fit:cover}
  .btn.primary{color:#15181b;font-weight:600}
  button:focus-visible{outline:2px solid var(--shell-accent);outline-offset:3px}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .seg button{min-height:28px}.field input{min-width:0}
  .prototype-note{font-size:12px;color:var(--shell-muted);line-height:1.6;padding:12px 8px;border-top:1px solid var(--shell-border);margin-top:12px}
  @media(min-width:1600px){.rail{width:208px}.inspector{width:304px}.stage-canvas{padding:16px 24px}}
  @media(max-width:1100px){.rail{width:152px}.inspector{width:248px}.rail-thumb{width:36px}.topbar{gap:8px}}
  @media(max-width:780px){body{height:auto;overflow:auto}.app{height:auto;min-height:100dvh}.topbar{height:auto;min-height:48px;padding:10px 12px;flex-wrap:wrap}.body{display:grid;grid-template-columns:minmax(0,1fr)}.rail{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--shell-border)}.rail-title,.prototype-note{display:none}.rail-item{min-width:144px}.inspector{width:auto;overflow:visible;border-left:0;border-top:1px solid var(--shell-border);display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.timeline{height:150px}.field:first-child{grid-column:1/-1}.stage-toolbar{padding:0 12px}}
  @media(max-width:420px){.inspector{grid-template-columns:minmax(0,1fr)}.topbar>span{display:none}.field input,.field textarea,.field select{font-size:16px}.scene-summary{flex-wrap:wrap}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.shot:hover,.btn:active{transform:none}}
[hidden]{display:none!important}
[role="button"]:focus-visible{outline:2px solid var(--shell-accent);outline-offset:2px}
</style>
</head>

<script>
const items=[...document.querySelectorAll('.rail-item')];
const shots=[...document.querySelectorAll('.shot')];
const drafts=items.map(()=>({prompt:document.querySelector('#field-0').value,dialogue:document.querySelector('#field-1').value}));
let current=0;
function selectShot(i){
 drafts[current]={prompt:document.querySelector('#field-0').value,dialogue:document.querySelector('#field-1').value};current=i;
 [items,shots].forEach(group=>group.forEach((el,n)=>{el.classList.toggle('active',n===i);el.setAttribute('aria-pressed',String(n===i));}));
 document.querySelector('#scene-title').textContent=String(i+1).padStart(2,'0')+' / '+items[i].querySelector('.rail-name').textContent;
 document.querySelector('.badge').textContent='分镜 '+String(i+1).padStart(2,'0')+' · 风格示意';
 document.querySelector('#field-0').value=drafts[i].prompt;document.querySelector('#field-1').value=drafts[i].dialogue;
}
[items,shots].forEach(group=>group.forEach((el,i)=>{el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','选择分镜 '+(i+1));el.setAttribute('aria-pressed',String(i===0));el.onclick=()=>selectShot(i);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectShot(i);}};}));
document.querySelector('#preview-toggle').onclick=function(){const active=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',String(active));document.querySelector('.rail').hidden=active;document.querySelector('.inspector').hidden=active;this.textContent=active?'返回编辑':'专注画面';};
document.querySelector('#field-2').onchange=function(){const ratio=['16/9','9/16','1/1'][this.selectedIndex];document.querySelector('.frame').style.aspectRatio=ratio;document.querySelector('.scene-summary small').textContent=this.value+' · 示例画面';};
</script>
