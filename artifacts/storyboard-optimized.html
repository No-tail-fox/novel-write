<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryDream 漫剧分镜编辑器 (UI Contract Optimized)</title>
    <style>
        :root {
            --shell-bg: #101214;
            --shell-surface: #15181b;
            --shell-surface-raised: #1b1f23;
            --shell-border: #343a40;
            --shell-text: #f4f6f8;
            --shell-muted: #b1b8be;
            --shell-accent: #f2614b;
            --shell-focus: #f2614b;
            --panel: var(--shell-surface);
            --panel-2: var(--shell-surface-raised);
            --panel-3: #24292e;
            --line: var(--shell-border);
            --sd-radius: 6px;
            --sd-page-inset: 24px;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--shell-bg); color: var(--shell-text); height: 100vh; overflow: hidden; }
        
        /* 顶部栏 */
        header { height: 44px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 var(--sd-page-inset); justify-content: space-between; background: var(--shell-surface); }
        
        /* 中间区域 */
        .main-work { display: flex; flex: 1; overflow: hidden; }
        .workspace { flex: 1; padding: var(--sd-page-inset); display: flex; align-items: center; justify-content: center; position: relative; }
        .canvas-box { width: 100%; height: 100%; border: 2px dashed var(--line); border-radius: var(--sd-radius); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
        .inspector { width: 320px; border-left: 1px solid var(--line); padding: 24px; background: var(--panel-2); overflow-y: auto; }
        
        /* 底部栏 */
        .timeline { height: 180px; background: var(--panel-3); border-top: 1px solid var(--line); padding: 16px var(--sd-page-inset); display: flex; align-items: center; gap: 16px; overflow-x: auto; }
        
        /* 分镜卡片 */
        .panel-card { width: 140px; height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--sd-radius); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; }
        .panel-card:hover { border-color: var(--shell-accent); }
        .panel-status { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #65b883; }
        
        /* 控件样式模仿 */
        .button { background: var(--shell-accent); color: white; border: none; padding: 6px 16px; border-radius: 4px; font-weight: 500; cursor: pointer; }
        .text-field { width: 100%; background: var(--shell-bg); border: 1px solid var(--line); color: white; padding: 8px; border-radius: 4px; margin-top: 8px; }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: 600;">漫剧分镜工作区</div>
        <button class="button">一键全部生成</button>
    </header>
    <div class="main-work">
        <div class="workspace">
            <div class="canvas-box">
                <div style="font-size: 24px;">🎨</div>
                <div style="color: var(--shell-muted);">当前分镜画面预览区域</div>
            </div>
        </div>
        <div class="inspector">
            <h3 style="margin-top: 0;">分镜属性</h3>
            <label style="font-size: 12px; color: var(--shell-muted);">提示词 Prompt</label>
            <textarea class="text-field" rows="4">描述画面场景...</textarea>
            <label style="display: block; margin-top: 16px; font-size: 12px; color: var(--shell-muted);">对白内容</label>
            <input class="text-field" placeholder="输入分镜对白...">
        </div>
    </div>
    <div class="timeline">
        <div class="panel-card"><span class="panel-status"></span>分镜 01</div>
        <div class="panel-card">分镜 02</div>
        <div class="panel-card">分镜 03</div>
        <button style="background: transparent; border: 1px dashed var(--line); color: var(--shell-muted); height: 100%; width: 80px; cursor: pointer;">+ 添加</button>
    </div>
</body>
</html>
